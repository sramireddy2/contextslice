[project]
name = "contextslice"
version = "0.1.0"
description = "A context compiler: selects the smallest useful slice of a Figma design for a coding agent under a token budget."
readme = "README.md"
authors = [
    { name = "Shashank Ramireddy", email = "shanky.ramireddy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "tokenizers>=0.23.2",
    "typer>=0.27.2",
]

[project.scripts]
# `uv run contextslice ...` resolves to the Typer app object in src/contextslice/cli.py
contextslice = "contextslice.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Third-party code (git submodule) and raw notes are not ours to lint.
extend-exclude = ["vendor", "research-notes"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear (likely bugs),
# UP = modern-Python upgrades, SIM = simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The prompt rules are prose the model reads; one rule per line matters more than 100 columns.
"src/contextslice/eval/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
